<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <main>
        <section class="card-section">
            
        </section>
        <button class="add-btn" id="add-book">
            <svg class="custom-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg>
            <h1>Add Book</h1>
        </button>
        <dialog>
            <form id="bookForm">
                <label for="bookName">
                    Book Name *
                </label>
                <input 
                    type="text" 
                    id="bookName" 
                    name="bookName" 
                    required
                />
                <label for="author">
                    Author *
                </label>
                <input 
                    type="text" 
                    id="author" 
                    name="author" 
                    required
                />
                <label for="genre">
                    Genre *
                </label>
                <input 
                    type="text" 
                    id="genre" 
                    name="genre" 
                    required
                />
               <label for="read">
                <input type="checkbox" id="read">
                Book Read?
               </label>
               <input type="submit" id="submit" class="btn">
            </form>
        </dialog>
    </main>
</body>
</html>
